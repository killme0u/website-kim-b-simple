spring:
  application:
    name: board-backend
  # SMTP 계정·CAPTCHA secret 같은 비밀값은 저장소 루트의 .env 에서 주입한다(.gitignore 대상).
  #   PS> Copy-Item .env.example .env   ← 저장소 루트에서 1회
  # optional: 이므로 .env 가 없어도 앱은 그대로 뜬다. dotenv 가 아니라 .properties 문법으로 읽힌다.
  # 두 경로를 모두 두는 이유: 저장소 루트에서 실행(java -jar)과 모듈 디렉터리에서 실행(bootRun)을
  # 모두 지원하기 위해서다. bootRun 은 build.gradle 이 절대경로도 함께 넘긴다.
  # 같은 이름의 OS 환경 변수가 있으면 그쪽이 이긴다(운영/컨테이너 배포 경로).
  config:
    import:
      - optional:file:./.env[.properties]
      - optional:file:../.env[.properties]
  # DB 주소는 작업 PC마다 다르다(회사·집·학원의 Docker 호스트가 각각 다름). 저장소 루트 .env 의
  # PGSQL_HOST / PGSQL_PORT 로 맞춘다. .env 가 없어도 기동되도록 기본값은 기존 값을 그대로 둔다.
  # 주의: 줄 자체가 없을 때만 기본값이 쓰인다. PGSQL_HOST= 처럼 값만 비우면 빈 호스트가 된다.
  # 컨테이너 배포는 SPRING_DATASOURCE_URL 환경 변수가 이 URL 을 통째로 덮어쓴다(docker-compose.yml).
  datasource:
    url: jdbc:postgresql://${PGSQL_HOST:192.168.29.124}:${PGSQL_PORT:5432}/board_db
    username: board_user
    password: board_password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  # clean(스키마 전체 삭제)을 막는다. 이전 설정은 clean-disabled: false 와
  # clean-on-validation-error: true 였는데, 그 조합에서는 마이그레이션 검증이 실패하면
  # 앱이 뜨는 것만으로 대상 DB 가 통째로 지워진다. PC 마다 다른 DB 를 보는 지금 구성에서는
  # 특히 위험하다(PGSQL_HOST 참고). 검증 실패는 삭제가 아니라 기동 실패로 드러나야 한다.
  # 스키마가 어긋났다면 마이그레이션을 추가하거나, 버려도 되는 DB 임을 확인한 뒤 직접 처리한다.
  flyway:
    enabled: true
    baseline-on-migrate: true
    clean-disabled: true
    clean-on-validation-error: false
  # SMTP 설정. 값은 저장소 루트 .env 에서 온다(위 spring.config.import 참고).
  # MAIL_SMTP_HOST 가 비어 있으면 MailConfig 가 로그 전용 발송기로 폴백한다(개발 환경 기본값).
  # 465 = 암묵적 SSL(SMTPS, 네이버 기본). 587 을 쓰려면 .env 에서
  # MAIL_SMTP_SSL=false, MAIL_SMTP_STARTTLS=true 로 바꾼다.
  mail:
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        # SMTP 대화 전체(인증 정보 포함)를 stdout 에 찍는다. 디버깅할 때만 켠다.
        debug: ${MAIL_DEBUG:false}
        smtp:
          auth: true
          ssl:
            enable: ${MAIL_SMTP_SSL:true}
            trust: ${MAIL_SMTP_HOST:}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS:false}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB

app:
  storage:
    root: ./uploads
  mail:
    # 보내는 사람 주소. spring.mail.from 은 Spring Boot 표준 속성이 아니라서 여기서 받는다.
    # 네이버 SMTP 는 보통 MAIL_USERNAME 과 같은 주소만 발신자로 허용한다.
    from: ${MAIL_FROM_ADMIN:${MAIL_FROM:no-reply@localhost}}
    # 메일 본문 링크의 기준 주소. 배포 시 외부에서 접근 가능한 주소로 바꾼다.
    base-url: ${APP_BASE_URL:http://localhost:8080}
  captcha:
    mode: ${CAPTCHA_MODE:fake}
    endpoint: ${CAPTCHA_ENDPOINT:}
    secret: ${CAPTCHA_SECRET:}
    expected-token: ${CAPTCHA_EXPECTED_TOKEN:dev-captcha}
    timeout: ${CAPTCHA_TIMEOUT:3s}