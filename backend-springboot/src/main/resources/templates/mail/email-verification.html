<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ko">
<head>
    <meta charset="UTF-8">
    <title>회원가입 인증</title>
</head>
<body style="margin:0;padding:24px;background-color:#f8fafc;font-family:'Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#0f172a;">
<div style="max-width:560px;margin:0 auto;background-color:#ffffff;border:1px solid #e2e8f0;border-radius:16px;padding:32px;">
    <p style="margin:0;font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:#4f46e5;">BoardSystem</p>
    <h1 style="margin:8px 0 0;font-size:22px;">회원가입 인증을 완료해 주세요</h1>
    <p style="margin:20px 0 0;font-size:14px;line-height:1.7;color:#475569;">
        아래 버튼을 눌러 이메일 인증을 완료하면 계정이 활성화됩니다.
        이 링크는 <strong th:text="${expiresIn}">24시간</strong> 동안만 유효합니다.
    </p>
    <p style="margin:28px 0;">
        <a th:href="${actionUrl}"
           style="display:inline-block;padding:12px 24px;border-radius:10px;background-color:#0f172a;color:#ffffff;font-size:14px;font-weight:600;text-decoration:none;">
            이메일 인증하기
        </a>
    </p>
    <p style="margin:0;font-size:13px;line-height:1.7;color:#64748b;">
        버튼이 눌리지 않으면 아래 주소를 브라우저에 붙여 넣으세요.<br>
        <a th:href="${actionUrl}" th:text="${actionUrl}" style="color:#4f46e5;word-break:break-all;">인증 링크</a>
    </p>
    <p style="margin:20px 0 0;padding:12px 16px;border-radius:10px;background-color:#f1f5f9;font-size:13px;color:#334155;">
        가입 화면에 직접 입력하려면 이 인증 코드를 사용하세요.<br>
        <code th:text="${token}" style="font-size:13px;word-break:break-all;">token</code>
    </p>
    <p style="margin:24px 0 0;font-size:12px;color:#94a3b8;">
        본인이 요청하지 않았다면 이 메일을 무시하셔도 됩니다.
    </p>
</div>
</body>
</html>
