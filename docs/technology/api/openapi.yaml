# OpenAPI 명세 — 수기 관리 문서
#
# 상태: 확인됨 (컨트롤러·DTO 코드에서 도출)
#
# 주의: 이 파일은 자동 생성되지 않습니다. springdoc-openapi 의존성이 없습니다
#       (backend-springboot/build.gradle 확인). 컨트롤러를 바꾸면 이 파일도 함께 고쳐야 합니다.
#
# 검증되지 않은 항목은 description 에 [확인필요] 로 표시했습니다.

openapi: 3.1.0

info:
  title: Simple Board API
  version: 0.0.1-SNAPSHOT
  description: |
    익명/회원 게시판 통합 플랫폼 API.

    ## 인증
    세션 쿠키(`JSESSIONID`) 기반입니다. JWT가 아닙니다.

    ## CSRF
    모든 응답에 `XSRF-TOKEN` 쿠키가 내려갑니다(httpOnly 아님).
    변경 요청(POST/PUT/DELETE)은 그 값을 `X-XSRF-TOKEN` 헤더로 되돌려보내야 합니다.
    예외: `POST /api/auth/login`, `POST /api/members/signup`

    ## 권한 판정 위치
    HTTP 경로 규칙(SecurityConfig)과 도메인 판정(Board/Post)이 2층으로 나뉩니다.
    글 쓰기·수정·삭제는 HTTP 층에서 permitAll 이고 실제 판정은 도메인이 합니다.

servers:
  - url: http://localhost:8080
    description: 로컬 (Docker Compose 또는 bootRun)
  - url: http://localhost:5173
    description: 로컬 개발 (Vite dev server, /api 를 8080 으로 프록시)

tags:
  - name: auth
    description: 로그인·로그아웃·현재 사용자
  - name: members
    description: 가입·인증·복구
  - name: mypage
    description: 내 활동
  - name: boards
    description: 게시판
  - name: posts
    description: 게시글
  - name: comments
    description: 댓글
  - name: files
    description: 첨부파일

paths:

  /api/auth/login:
    post:
      tags: [auth]
      summary: 로그인
      description: |
        Spring Security formLogin 이 처리합니다. JSON 이 아니라 **form 인코딩**입니다.
        CSRF 검사에서 면제됩니다.

        계정 상태 검사:
        - PENDING, ACTIVE → 성공
        - SUSPENDED → 실패 (isAccountNonLocked)
        - DELETED → 실패 (isEnabled)

        로그인 실패 횟수 제한이 없습니다.
      security: []
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  format: password
      responses:
        '200':
          description: 로그인 성공. JSESSIONID 와 XSRF-TOKEN 쿠키 발급
          headers:
            Set-Cookie:
              schema:
                type: string
        '401':
          description: 인증 실패 (JsonAuthenticationFailureHandler)

  /api/auth/logout:
    post:
      tags: [auth]
      summary: 로그아웃
      description: CSRF 토큰이 **필요합니다**. 없으면 403.
      responses:
        '204':
          description: 로그아웃 성공
        '403':
          description: CSRF 토큰 누락 또는 불일치 (본문 없음)

  /api/me:
    get:
      tags: [auth]
      summary: 현재 로그인 사용자
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/me/posts:
    get:
      tags: [mypage]
      summary: 내가 쓴 글
      description: |
        회원 글만 반환합니다. 로그인 전 비회원으로 쓴 글은 포함되지 않습니다.
        정렬은 id 내림차순 고정입니다.
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePostListItem'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/me/comments:
    get:
      tags: [mypage]
      summary: 내가 쓴 댓글
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageComment'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/members/signup:
    post:
      tags: [members]
      summary: 회원가입
      description: |
        CSRF 면제 경로입니다. CAPTCHA 가 유일한 자동화 방어선입니다.

        처리 순서:
        1. CAPTCHA 검증 (실패 시 400, 회원 생성 안 됨)
        2. 닉네임 정규화 후 PENDING 회원 저장
        3. 24시간 인증 토큰 발급 (SHA-256 해시만 저장)
        4. 커밋 후 비동기 메일 발송

        메일 발송 실패는 응답에 반영되지 않습니다. 201 을 받아도 메일이 갔다는 보장이 없습니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupCommand'
      responses:
        '201':
          description: 가입 성공. 계정 상태는 PENDING
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          description: 검증 실패 또는 CAPTCHA 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '409':
          description: |
            아이디·이메일·닉네임 중 하나가 중복.
            **어느 필드인지 알려주지 않습니다.**
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/members/verify-email:
    get:
      tags: [members]
      summary: 이메일 인증 완료
      description: |
        **GET 이면서 상태를 변경합니다.** 메일 클라이언트의 링크 프리페치가
        토큰을 소비할 수 있습니다.

        plan.md 의 API 계약표는 POST 로 적혀 있어 구현과 다릅니다. [미결정]

        성공 시 PENDING → ACTIVE 로 전환하고 토큰을 사용 처리합니다.
      security: []
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
          description: 메일 링크에 담긴 원문 UUID
      responses:
        '200':
          description: 인증 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: [verified]
        '400':
          description: 토큰이 없거나 만료·사용됨
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/members/verify-email/resend:
    post:
      tags: [members]
      summary: 인증 메일 재발송
      description: |
        계정 열거 방지를 위해 계정 유무·상태와 무관하게 202 를 반환합니다.
        실제 발송은 PENDING 계정에만 일어납니다.

        **호출 횟수 제한이 없고, 기존 토큰을 무효화하지 않습니다.** [미결정]
        호출할 때마다 유효한 토큰이 하나씩 늘어납니다.
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyCommand'
      responses:
        '202':
          description: 요청 접수 (실제 발송 여부와 무관)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: [sent]

  /api/members/password-reset/request:
    post:
      tags: [members]
      summary: 비밀번호 재설정 요청
      description: |
        CAPTCHA 가 필요합니다. 토큰 유효 기간은 1시간입니다.
        계정 유무와 무관하게 202 를 반환합니다(CAPTCHA 실패만 400).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestCommand'
      responses:
        '202':
          description: 요청 접수
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: [requested]
        '400':
          description: CAPTCHA 실패 또는 검증 실패
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/members/password-reset/change:
    post:
      tags: [members]
      summary: 비밀번호 변경 (토큰 기반)
      description: |
        토큰이 곧 인증이므로 로그인 상태가 아니어도 됩니다.
        성공 시 mustChangePassword=false, tempPasswordExpiresAt=null 로 초기화됩니다.

        **기존 세션을 무효화하지 않습니다.** [미결정]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetChangeCommand'
      responses:
        '200':
          description: 변경 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    examples: [changed]
        '400':
          description: 토큰 무효·만료·사용됨, 또는 비밀번호 길이 위반
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'

  /api/members/username-availability:
    get:
      tags: [members]
      summary: 아이디 중복 확인
      description: |
        UX 편의 기능입니다. 실제 방어선은 DB UNIQUE 제약과 409 변환입니다(PRD 2.4).

        **정규화 없이 원본으로 조회합니다.** 저장도 trim 하지 않으므로 현재는 일치하지만,
        앞뒤 공백이 든 아이디가 만들어질 수 있습니다. [미결정]

        이 API 는 의도적으로 아이디 존재 여부를 노출합니다.
      security: []
      parameters:
        - name: username
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'

  /api/members/nickname-availability:
    get:
      tags: [members]
      summary: 닉네임 중복 확인
      description: |
        저장 경로와 **같은 정규화**(Member.normalizeNickname)를 거쳐 조회합니다(결정 D5).
        정규화: 앞뒤 공백 제거, 빈 문자열 → null.

        정규화 결과가 null 이면 닉네임 미사용이라 충돌 대상이 없어 available=true 입니다.

        회귀 테스트: MemberControllerTest, MemberTest
      security: []
      parameters:
        - name: nickname
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Availability'

  /api/members/username-recovery:
    post:
      tags: [members]
      summary: 아이디 찾기
      description: |
        가입 이메일로 아이디를 평문 발송합니다.

        **CAPTCHA 가 없습니다.** 가입·비밀번호 재설정에는 있는데 여기만 없습니다. [미결정]
        본인 확인 수단이 이메일 소유뿐입니다(plan.md 선결 결정 #5).
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmailOnlyCommand'
      responses:
        '202':
          description: 요청 접수 (계정 유무와 무관)
          content:
            application/json:
              schema:
                type: object
                properties:
                  message:
                    type: string
                    examples: ['가입 이메일로 아이디 안내를 전송했습니다.']

  /api/boards:
    get:
      tags: [boards]
      summary: 게시판 목록
      description: |
        **권한 검사가 없습니다.** 누구나 전체 목록을 봅니다.
        회원제 게시판도 목록에는 나오고, 입장 시점에 막힙니다.
        displayOrder 오름차순.
      security: []
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/BoardResponse'

  /api/boards/{slug}:
    get:
      tags: [boards]
      summary: 게시판 단건 조회
      security: []
      parameters:
        - $ref: '#/components/parameters/BoardSlug'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BoardResponse'
        '400':
          description: 존재하지 않는 slug
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/boards/{boardSlug}/posts:
    get:
      tags: [posts]
      summary: 게시글 목록
      description: |
        존재하지 않는 slug 로 호출하면 **500** 이 납니다(NoSuchElementException 미처리).
        같은 상황에서 GET /api/boards/{slug} 는 400 을 냅니다. [미결정]
      security: []
      parameters:
        - $ref: '#/components/parameters/BoardSlugPath'
        - name: keyword
          in: query
          required: false
          schema:
            type: string
          description: 제목·본문 LIKE 검색
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/Size'
        - $ref: '#/components/parameters/Sort'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PagePostListItem'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '500':
          description: 존재하지 않는 게시판 (404 여야 함)

    post:
      tags: [posts]
      summary: 게시글 작성
      description: |
        HTTP 층에서는 permitAll 이고 판정은 Board.checkWritable 이 합니다.

        회원/비회원 분기는 **세션으로** 결정됩니다. 로그인 상태면 guestNickname 을
        보내도 무시하고 회원 글로 저장합니다.

        주의:
        - guestPassword 에 길이 제약이 없습니다. [미결정]
        - 비로그인 + guestNickname 누락 시 DB CHECK 위반으로 409 DUPLICATE 가 납니다(오해를 부르는 코드).
        - board.allowsAttachment 를 검사하지 않아 첨부 불가 게시판에도 첨부가 붙습니다. [미결정]
        - attachments 배열의 값을 검증 없이 그대로 저장합니다. [미결정]
      security: []
      parameters:
        - $ref: '#/components/parameters/BoardSlugPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCommand'
      responses:
        '201':
          description: 작성 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          description: 제목·본문 누락
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '409':
          description: 비회원 글인데 guestNickname/guestPassword 가 없음 (CHECK 제약 위반)

  /api/posts/{id}:
    get:
      tags: [posts]
      summary: 게시글 단건 조회
      description: |
        **부수효과: 조회수가 증가합니다.**
        - 로그인: post_view_log 에 오늘 기록이 없을 때만 +1
        - 비로그인: 항상 +1 (PRD 2.6 의 쿠키 방식 미구현) [미결정]

        없거나 삭제된 글은 **500** 이 납니다(404 여야 함). [미결정]
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'
        '500':
          description: 존재하지 않거나 삭제된 글 (404 여야 함)

    put:
      tags: [posts]
      summary: 게시글 수정
      description: |
        비회원 글이면 guestPassword 를 본문에 담습니다.
        판정은 Post.checkEditable.

        로그인 상태에서는 비회원 글을 비밀번호로 수정할 수 없습니다
        (로그인 분기로 들어가 작성자 일치만 확인). [미결정]
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostUpdateCommand'
      responses:
        '204':
          description: 수정 완료
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: 존재하지 않거나 삭제된 글

    delete:
      tags: [posts]
      summary: 게시글 삭제 (소프트)
      description: |
        deleted_at 을 설정하고 행은 남깁니다.

        **guestPassword 를 쿼리 파라미터로 받습니다.** 수정은 본문인데 삭제는 쿼리입니다.
        쿼리 파라미터는 접근 로그·프록시 로그·브라우저 히스토리에 남습니다. [미결정]
      security: []
      parameters:
        - $ref: '#/components/parameters/PostId'
        - name: guestPassword
          in: query
          required: false
          schema:
            type: string
          description: 비회원 글 삭제 시 필요
      responses:
        '204':
          description: 삭제 완료
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          description: 존재하지 않거나 이미 삭제된 글

  /api/posts/{id}/like:
    post:
      tags: [posts]
      summary: 좋아요 토글
      description: |
        이미 눌렀으면 취소합니다. 회원당 글당 1회(post_like 복합 PK).

        **응답 본문이 없어 결과 상태를 알 수 없습니다.** [미결정]
        프론트엔드가 낙관적 업데이트로 자체 추정합니다.
      parameters:
        - $ref: '#/components/parameters/PostId'
      responses:
        '204':
          description: 토글 완료
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/posts/{postId}/comments:
    get:
      tags: [comments]
      summary: 댓글 목록
      description: |
        **페이징하지 않습니다.** 전체를 한 번에 반환합니다. id 오름차순, 삭제된 것 제외.
        게시판 읽기 권한 검사를 거칩니다.
      security: []
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      responses:
        '200':
          description: 성공
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentResponse'
        '401':
          $ref: '#/components/responses/AuthRequired'

    post:
      tags: [comments]
      summary: 댓글 작성
      description: 로그인 필수이며 게시판의 allowsComment 가 참이어야 합니다.
      parameters:
        - $ref: '#/components/parameters/PostIdPath'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCommand'
      responses:
        '201':
          description: 작성 완료
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    format: int64
        '400':
          description: |
            내용 누락, 또는 댓글 불가 게시판.
            후자의 메시지는 영어입니다("Board doesn't allow comments"). [미결정]
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          $ref: '#/components/responses/AuthRequired'

  /api/comments/{id}:
    put:
      tags: [comments]
      summary: 댓글 수정
      parameters:
        - $ref: '#/components/parameters/CommentId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCommand'
      responses:
        '204':
          description: 수정 완료
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

    delete:
      tags: [comments]
      summary: 댓글 삭제 (소프트)
      parameters:
        - $ref: '#/components/parameters/CommentId'
      responses:
        '204':
          description: 삭제 완료
        '401':
          $ref: '#/components/responses/AuthRequired'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/files:
    post:
      tags: [files]
      summary: 파일 업로드
      description: |
        **인증이 없습니다.** permitAll 이고 도메인 판정도 없어 누구나 업로드할 수 있습니다. [미결정]

        응답의 contentType 과 mediaKind 는 **클라이언트가 보낸 Content-Type 기반**입니다.
        서버가 파일 내용을 검사하지 않습니다(PRD 6.3 체크리스트 미이행). [미결정]

        이 시점에는 attachment 행이 생기지 않습니다. 게시글을 저장해야 연결됩니다.
        연결되지 않은 업로드는 고아 파일로 디스크에 남습니다(정리 없음). [미결정]

        크기 제한: 파일·요청 각 100MB
      security: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 업로드 완료
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileResponse'
        '415':
          description: 허용되지 않는 파일 형식
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '500':
          description: 저장 실패

  /api/files/{storedName}:
    get:
      tags: [files]
      summary: 파일 다운로드 또는 인라인 표시
      description: |
        **인증이 없습니다.** storedName(UUID)만 알면 회원제 게시판의 첨부도 받을 수 있습니다.
        UUID 가 사실상의 접근 토큰입니다. [미결정]

        Content-Type 은 서버가 Files.probeContentType 으로 **재판정**합니다
        (업로드 시 저장된 값을 쓰지 않음).

        경로 탈출 시도는 SecurityException 이 나지만 핸들러가 없어 500 이 됩니다(403 이 적절). [미결정]
      security: []
      parameters:
        - name: storedName
          in: path
          required: true
          schema:
            type: string
          description: UUID + 원본 확장자
        - name: download
          in: query
          required: false
          schema:
            type: string
          description: |
            값이 있으면 Content-Disposition: attachment,
            없으면 inline. 값 자체는 보지 않습니다.
      responses:
        '200':
          description: 파일 스트림
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '500':
          description: 파일 없음 또는 경로 탈출 시도

components:

  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: JSESSIONID
      description: 로그인 시 발급되는 세션 쿠키

  parameters:
    Page:
      name: page
      in: query
      required: false
      schema:
        type: integer
        default: 0
      description: Spring Pageable 표준 (0부터)
    Size:
      name: size
      in: query
      required: false
      schema:
        type: integer
        default: 20
      description: Spring Pageable 표준
    Sort:
      name: sort
      in: query
      required: false
      schema:
        type: string
      description: 'Spring Pageable 표준. 예: createdAt,desc'
    BoardSlug:
      name: slug
      in: path
      required: true
      schema:
        type: string
        examples: [free, qna, archive]
    BoardSlugPath:
      name: boardSlug
      in: path
      required: true
      schema:
        type: string
    PostId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
    PostIdPath:
      name: postId
      in: path
      required: true
      schema:
        type: integer
        format: int64
    CommentId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64

  responses:
    AuthRequired:
      description: |
        로그인이 필요합니다.
        본문 형태가 두 가지입니다 — 필터 층(SecurityConfig)은 본문이 없고,
        도메인 층(AuthenticationRequiredException)은 ApiError 를 담습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Forbidden:
      description: |
        권한이 없거나 비회원 글 비밀번호가 일치하지 않습니다.
        CSRF 실패도 403 이며 이때는 본문이 없습니다.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'

  schemas:

    ApiError:
      type: object
      description: 모든 오류 응답의 공통 형식
      properties:
        code:
          type: string
          enum: [DUPLICATE, AUTH_REQUIRED, FORBIDDEN, UNSUPPORTED_FILE, BAD_REQUEST]
        message:
          type: string
          description: 사용자에게 보여줄 한국어 문구

    MeResponse:
      type: object
      description: |
        nickname 이 포함되지 않습니다. Member 에는 있지만 MeResponse 가 담지 않습니다. [미결정]
      properties:
        id:
          type: integer
          format: int64
        username:
          type: string
        name:
          type: string
        email:
          type: string
        status:
          $ref: '#/components/schemas/MemberStatus'
        role:
          $ref: '#/components/schemas/MemberRole'
        mustChangePassword:
          type: boolean
          description: 컬럼은 있으나 임시 비밀번호 발급 경로가 없어 항상 false 입니다.

    MemberStatus:
      type: string
      enum: [PENDING, ACTIVE, SUSPENDED, DELETED]
      description: |
        SUSPENDED, DELETED 는 정의만 있고 전환 코드가 없습니다.
        다만 로그인 차단 판정에는 실제로 쓰입니다.

    MemberRole:
      type: string
      enum: [USER, ADMIN]
      description: ADMIN 계정을 만드는 경로가 없습니다(DB 직접 수정만 가능).

    MediaKind:
      type: string
      enum: [IMAGE, VIDEO, AUDIO, FILE]
      description: |
        image/svg+xml 은 스크립트 실행이 가능해 IMAGE 가 아니라 FILE 로 분류합니다(PRD 2.5).

    SignupCommand:
      type: object
      required: [username, password, name, email, phone, captchaToken]
      properties:
        username:
          type: string
          minLength: 4
          maxLength: 30
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 100
          description: 복잡도 요구가 없습니다.
        name:
          type: string
          maxLength: 50
        nickname:
          type: string
          maxLength: 30
          description: 선택 항목. 저장·조회 모두 normalizeNickname 을 거칩니다.
        email:
          type: string
          format: email
        phone:
          type: string
          maxLength: 20
          description: |
            **필수입니다.** UI.md 는 선택으로 그리지만 구현은 @NotBlank 입니다. [미결정]
            어디서도 사용되지 않습니다.
        captchaToken:
          type: string
          maxLength: 4096
        termsAccepted:
          type: boolean
          description: |
            **검증도 저장도 되지 않습니다.** @NotNull 이 없고 SignupService 가 읽지 않습니다.
            동의 기록이 남지 않습니다. [미결정]

    EmailOnlyCommand:
      type: object
      required: [email]
      properties:
        email:
          type: string
          format: email

    PasswordResetRequestCommand:
      type: object
      required: [email, captchaToken]
      properties:
        email:
          type: string
          format: email
        captchaToken:
          type: string
          maxLength: 4096

    PasswordResetChangeCommand:
      type: object
      required: [token, newPassword]
      properties:
        token:
          type: string
        newPassword:
          type: string
          format: password
          minLength: 8
          maxLength: 100

    Availability:
      type: object
      properties:
        available:
          type: boolean

    BoardResponse:
      type: object
      description: id 를 노출하지 않습니다. slug 가 외부 식별자입니다.
      properties:
        slug:
          type: string
        name:
          type: string
        requiresAuthToRead:
          type: boolean
        requiresAuthToWrite:
          type: boolean
        allowsComment:
          type: boolean
        allowsAttachment:
          type: boolean
          description: 프론트엔드 UI 판단용. **백엔드가 강제하지 않습니다.** [미결정]

    PostCommand:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
          description: 마크다운. 프론트엔드가 react-markdown 으로 렌더링합니다.
        guestNickname:
          type: string
          description: 비회원 글일 때. 로그인 상태면 무시됩니다.
        guestPassword:
          type: string
          format: password
          description: 비회원 글일 때. **길이 제약이 없습니다.** [미결정]
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FileResponse'
          description: 업로드 API 의 응답을 그대로 담습니다. 서버가 재검증하지 않습니다. [미결정]

    PostUpdateCommand:
      type: object
      required: [title, content]
      properties:
        title:
          type: string
        content:
          type: string
        guestPassword:
          type: string
          format: password

    PostResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        boardSlug:
          type: string
        title:
          type: string
        content:
          type: string
        authorName:
          type: string
          description: |
            회원 글이면 **username(로그인 아이디)**, 비회원 글이면 guestNickname.
            name 도 nickname 도 아닙니다. 로그인 아이디가 모든 방문자에게 노출됩니다. [미결정]
        viewCount:
          type: integer
        likeCount:
          type: integer
        createdAt:
          type: string
          format: date-time
        owner:
          type: boolean
          description: |
            [확인필요] Java 필드명은 isOwner 이고 Lombok 이 isOwner() 게터를 만듭니다.
            Jackson 은 boolean 의 isXxx() 게터를 xxx 로 직렬화하므로 JSON 키는 owner 로 보입니다.
            실제 응답으로 검증하지 못했습니다.

            값 자체에도 주의가 필요합니다 — 비로그인 조회자에게는 **모든 비회원 글**이
            true 로 나옵니다(PostResponse.java:29-30). 실제 권한은 비밀번호 검증이 막지만
            UI 는 모든 비회원 글에 수정·삭제 버튼을 띄우게 됩니다. [미결정]
        attachments:
          type: array
          items:
            $ref: '#/components/schemas/FileResponse'

    PostListItemResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        authorName:
          type: string
          description: PostResponse 와 같은 규칙(회원은 username).
        viewCount:
          type: integer
        likeCount:
          type: integer
        createdAt:
          type: string
          format: date-time

    CommentCommand:
      type: object
      required: [content]
      properties:
        content:
          type: string

    CommentResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        postId:
          type: integer
          format: int64
        authorName:
          type: string
          description: 댓글은 회원만 쓸 수 있으므로 항상 username 입니다.
        content:
          type: string
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
        owner:
          type: boolean
          description: '[확인필요] PostResponse.owner 와 같은 직렬화 이슈.'

    FileResponse:
      type: object
      properties:
        originalName:
          type: string
        storedName:
          type: string
          description: UUID + 원본 확장자. 다운로드 URL 의 경로 변수입니다.
        contentType:
          type: string
          description: 업로드 시에는 **클라이언트가 보낸 값** 그대로입니다. [미결정]
        mediaKind:
          $ref: '#/components/schemas/MediaKind'
        byteSize:
          type: integer
          format: int64

    PageMetadata:
      type: object
      description: Spring Data Page 직렬화 형태 (일부 필드만 표기)
      properties:
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
        number:
          type: integer
        size:
          type: integer
        first:
          type: boolean
        last:
          type: boolean
        empty:
          type: boolean

    PagePostListItem:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/PostListItemResponse'

    PageComment:
      allOf:
        - $ref: '#/components/schemas/PageMetadata'
        - type: object
          properties:
            content:
              type: array
              items:
                $ref: '#/components/schemas/CommentResponse'

security:
  - sessionCookie: []
