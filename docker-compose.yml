services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/board_db
      - SPRING_DATASOURCE_USERNAME=board_user
      - SPRING_DATASOURCE_PASSWORD=board_password
      - APP_STORAGE_ROOT=/app/uploads
    depends_on:
      - postgres
    volumes:
      - board_uploads:/app/uploads

  postgres:
    image: postgres:15-alpine
    container_name: board-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=board_user
      - POSTGRES_PASSWORD=board_password
      - POSTGRES_DB=board_db
    volumes:
      - board_data:/var/lib/postgresql/data

volumes:
  board_data:
  board_uploads: