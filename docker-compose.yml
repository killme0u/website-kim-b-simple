services:
  app:
    build: .
    ports:
      - "${APP_HOST_PORT:-8080}:8080"
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://${PGSQL_HOST:-postgres}:${PGSQL_PORT:-5432}/board_db
      - SPRING_DATASOURCE_USERNAME=${DB_USERNAME:-board_user}
      - SPRING_DATASOURCE_PASSWORD=${DB_PASSWORD:-board_password}
      - APP_STORAGE_ROOT=/app/uploads
      # 아래 값은 저장소 루트 .env 에서 온다. docker compose 가 .env 를 자동으로 읽는다.
      # .env 가 없거나 값이 비면 빈 문자열이 되고, 앱은 로그 전용 발송기로 폴백한다.
      # 이미지 안에는 .env 를 넣지 않는다(Dockerfile 이 복사하지 않는다).
      - MAIL_SMTP_HOST=${MAIL_SMTP_HOST:-}
      - MAIL_SMTP_PORT=${MAIL_SMTP_PORT:-465}
      - MAIL_SMTP_SSL=${MAIL_SMTP_SSL:-true}
      - MAIL_SMTP_STARTTLS=${MAIL_SMTP_STARTTLS:-false}
      - MAIL_USERNAME=${MAIL_USERNAME:-}
      - MAIL_PASSWORD=${MAIL_PASSWORD:-}
      - MAIL_FROM_ADMIN=${MAIL_FROM_ADMIN:-no-reply@localhost}
      - MAIL_DEBUG=${MAIL_DEBUG:-false}
      - APP_BASE_URL=${APP_BASE_URL:-http://localhost:8080}
    depends_on:
      - postgres
    volumes:
      - board_uploads:/app/uploads

  postgres:
    image: postgres:15-alpine
    container_name: board-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USERNAME}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=board_db
    volumes:
      - board_data:/var/lib/postgresql/data

volumes:
  board_data:
  board_uploads: